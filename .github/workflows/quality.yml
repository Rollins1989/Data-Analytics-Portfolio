name: Portfolio Quality Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python source files
        run: |
          python -m compileall -q \
            01-ecommerce-sales-analysis \
            02-hr-employee-attrition \
            03-retail-business-intelligence \
            04-data-cleaning-pipeline \
            05-global-vaccination-dashboard \
            06-amazon-ppc-analytics

      - name: Validate notebooks and repository paths
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import nbformat
          from nbformat import validator

          projects = [
              Path("01-ecommerce-sales-analysis"),
              Path("02-hr-employee-attrition"),
              Path("03-retail-business-intelligence"),
              Path("04-data-cleaning-pipeline"),
              Path("05-global-vaccination-dashboard"),
              Path("06-amazon-ppc-analytics"),
          ]

          for project in projects:
              readme = project / "README.md"
              notebooks_dir = project / "notebooks"
              assert readme.is_file(), f"Missing README: {readme}"
              assert notebooks_dir.is_dir(), f"Missing notebooks directory: {notebooks_dir}"

              notebooks = sorted(notebooks_dir.glob("*.ipynb"))
              assert notebooks, f"No notebook found: {notebooks_dir}"

              for notebook in notebooks:
                  print(f"Validating notebook: {notebook}")
                  try:
                      with notebook.open(encoding="utf-8") as handle:
                          data = json.load(handle)
                      assert data.get("nbformat") == 4, f"Invalid nbformat: {data.get('nbformat')}"

                      # Normalize legacy notebooks in memory so current/future nbformat
                      # validation does not fail on missing cell IDs.
                      _, data = validator.normalize(data)
                      nbformat.validate(data)
                  except Exception as exc:
                      raise RuntimeError(
                          f"Notebook validation failed for {notebook}: {type(exc).__name__}: {exc}"
                      ) from exc

          print("Repository structure and notebook validation passed.")
          PY
